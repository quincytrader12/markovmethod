# ============================================================================
#  AppVeyor CI - builds the Mamba Terminal Windows installer in the cloud.
#
#  Independent of GitHub Actions: sign in at https://ci.appveyor.com with your
#  GitHub account, add this repo, and every push builds:
#     - dist\mamba-web.exe          (neon web HUD)
#     - dist\mamba-terminal.exe     (text terminal)
#     - installer_output\MambaTerminalSetup.exe   (the installer)
#  all downloadable from the build's ARTIFACTS tab.
# ============================================================================

version: 0.1.0.{build}

image: Visual Studio 2022

# Python 3.12 (x64) ships preinstalled on this image.
environment:
  PYTHON: "C:\\Python312-x64"

install:
  - cmd: "%PYTHON%\\python.exe --version"
  - cmd: "%PYTHON%\\python.exe -m pip install --upgrade pip"
  - cmd: "%PYTHON%\\python.exe -m pip install \".[terminal,web,build]\""

build_script:
  # 1) Build both executables from the PyInstaller specs.
  - cmd: "%PYTHON%\\python.exe -m PyInstaller --clean --noconfirm packaging\\mamba-terminal.spec"
  - cmd: "%PYTHON%\\python.exe -m PyInstaller --clean --noconfirm packaging\\mamba-web.spec"
  # 2) Smoke-test the web exe (starts the server, checks routes, exits).
  - cmd: "dist\\mamba-web.exe --selftest"
  # 3) Compile the installer with Inno Setup (preinstalled; fall back to choco).
  - ps: if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
  - cmd: "iscc installer\\mamba.iss"

# No unit-test phase on the CI image (tests run elsewhere); we only package here.
test: off

artifacts:
  - path: installer_output\MambaTerminalSetup.exe
    name: MambaTerminalSetup
  - path: dist\mamba-web.exe
    name: mamba-web
  - path: dist\mamba-terminal.exe
    name: mamba-terminal
